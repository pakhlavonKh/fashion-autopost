[project]
name = "fashion-autopost"
version = "1.0.0"
description = "Automated Clothing Product Publishing System for Telegram & Instagram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "boto3>=1.34.0",
    "playwright>=1.40.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "adapters*",
    "config*",
    "core*",
    "dashboard*",
    "llm*",
    "logging_setup*",
    "publishers*",
    "scheduler*",
    "storage*",
]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
