aggregator:
  base_url: https://api.aggregator.example.com
  mode: playwright
  stores:
  - zara
  - mango
  timeout_seconds: 30.0
alert:
  channel: console
  telegram_chat_id: null
daily_publish_cap: null
db_url: sqlite:///./data/app.db
dry_run: true
fx:
  fixed_rate: 1.08
  mode: fixed
  rates:
    EUR: 1.08
    GBP: 1.29
    TRY: 0.029
    USD: 1.0
include_product_link: true
markup: 15.0
max_products_per_run: 3
moderation:
  auto_approve: true
  enabled: false
prompt_path: ./prompt.txt
schedule:
  posts_per_day: 2
  times:
  - '10:00'
  - '18:00'
  timezone: UTC
scraper:
  headless: true
  scroll_steps: 3
  stores:
    asos:
      currency: GBP
      enabled: true
      max_items: 12
      selectors:
        item: article[data-auto-id='productTile']
        price: span[data-auto-id='productTilePrice']
        title: h2
      url: https://www.asos.com/women/new-in
    mango:
      currency: EUR
      enabled: true
      max_items: 10
      url: https://shop.mango.com/es/en/c/women/new-now
    zara:
      currency: EUR
      enabled: true
      max_items: 10
      url: https://www.zara.com/es/en/woman-new-in-l1180.html
  timeout_seconds: 30.0
  user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
    like Gecko) Chrome/124.0.0.0 Safari/537.36
  wait_after_scroll_ms: 1500
target_currency: USD
dashboard:
  enabled: true
  host: 0.0.0.0
  port: 8000
  admin_key: fashion-admin-2026
