aggregator:
  base_url: https://api.aggregator.example.com
  mode: playwright
  stores:
  - zara
  - mango
  timeout_seconds: 30.0
alert:
  channel: console
  telegram_chat_id: null
daily_publish_cap: null
dashboard:
  admin_key: fashion-admin-2026
  admin_password: fashion-admin-2026
  admin_username: admin
  enabled: true
  host: 0.0.0.0
  port: 8000
db_url: sqlite:///./data/app.db
dry_run: false
fx:
  fixed_rate: 1.08
  mode: fixed
  rates:
    EUR: 1.08
    GBP: 1.29
    TRY: 0.029
    USD: 1.0
